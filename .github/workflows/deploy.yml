name: Build a nasazení na GitHub Pages

on:
  push:
    branches: [main]
  # Pull requesty se jen sestaví (kontrola, že build projde), nenasazují se.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Kontrola typů
        run: npm run typecheck

      - name: Build (statický export do out/)
        run: npm run build

      # Vlastní doména: CNAME z kořene repozitáře se zkopíruje do výstupu.
      - name: Přidat CNAME
        run: cp CNAME out/CNAME

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nasazení
        id: deployment
        uses: actions/deploy-pages@v5
